<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة صحة الثدي والذكاء الطبي الاستباقي</title>
    <style>
        :root {
            --primary-pink: #d81b60;
            --light-pink: #fce4ec;
            --dark-text: #212121;
            --white: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fafafa;
            color: var(--dark-text);
            margin: 0;
            padding: 0;
        }
        header {
            background: linear-gradient(135deg, var(--primary-pink), #ad1457);
            color: var(--white);
            text-align: center;
            padding: 40px 20px;
        }
        header h1 {
            margin: 0;
            font-size: 28px;
        }
        header p {
            margin-top: 10px;
            font-size: 16px;
            opacity: 0.9;
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            background: var(--white);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 {
            color: var(--primary-pink);
            font-size: 22px;
            border-bottom: 2px solid var(--light-pink);
            padding-bottom: 10px;
        }
        .question-box {
            margin-bottom: 20px;
            background: var(--light-pink);
            padding: 15px 20px;
            border-radius: 10px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            background-color: var(--primary-pink);
            color: var(--white);
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #ad1457;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>PinkInsight: منصة التوعية والفحص الذكي</h1>
        <p>نظام ذكي لتمكين المرأة من الفحص المبكر وتقييم الصحة الوقائية</p>
    </header>

    <div class="container">
        <h2>دليل التقييم الذاتي والاستجابة الطبية</h2>
        <p>أجبي عن الأسئلة التالية بكل شفافية للحصول على التوجيه الطبي المناسب لحالتك:</p>
        
        <div class="question-box">
            <label>1. هل لاحظتِ أي تغير غير مألوف في شكل أو ملمس الثدي حديثاً؟</label>
            <select id="q1">
                <option value="no">لا، كل شيء طبيعي</option>
                <option value="yes">نعم، لاحظت تغيراً</option>
            </select>
        </div>

        <div class="question-box">
            <label>2. هل تشعرين بوجود كتلة صلبة أو تورم غير مستعتاد؟</label>
            <select id="q2">
                <option value="no">لا</option>
                <option value="yes">نعم</option>
            </select>
        </div>

        <button onclick="evaluateHealth()">تشغيل التحليل الفوري وتحديد خطة الرعاية</button>

        <div id="result"></div>
    </div>

    <script>
        function evaluateHealth() {
            const q1 = document.getElementById('q1').value;
            const q2 = document.getElementById('q2').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.style.display = 'block';
            
            if(q1 === 'yes' || q2 === 'yes') {
                resultDiv.style.backgroundColor = '#ffebee';
                resultDiv.style.color = '#c62828';
                resultDiv.innerHTML = '⚠️ التقييم يوصي بالمتابعة: بناءً على إجاباتك، نوصي بشدة بحجز موعد فوري في عيادة الفحص المبكر (الماموجرام) للاطمئنان.';
            } else {
                resultDiv.style.backgroundColor = '#e8f5e9';
                resultDiv.style.color = '#2e7d32';
                resultDiv.innerHTML = '✨ النتائج اطمئنانية: استمري بالفحص الذاتي الشهري بانتظام، ولا توجد مؤشرات تستدعي القلق.';
            }
        }
    </script>

</body>
</html>
